<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chatbot Pro - Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <div class="background"></div>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">

                <img src="{{ url_for('static', filename='images/chat.png') }}" alt="Logo">

                <h1>AI Chatbot</h1>

                <p>Welcome Back</p>

            </div>

            {% with messages = get_flashed_messages(with_categories=true) %} {% if messages %} {% for category, message in messages %}

            <div class="alert {{ category }}">
                {{ message }}
            </div>

            {% endfor %} {% endif %} {% endwith %}
            <form action="{{ url_for('login.login') }}" method="POST">

                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" name="username" placeholder="Username or Email" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input id="password" type="password" name="password" placeholder="Password" required>

                    <i class="fa-solid fa-eye toggle-password" onclick="togglePassword()"></i>
                </div>

                <div class="options">

                    <label>
            <input type="checkbox" name="remember">
            Remember Me
        </label>

                    <a href="{{ url_for('forgot.forgot_password') }}">
            Forgot Password?
        </a>

                </div>

                <!-- Login Button -->
                <button type="submit" class="login-btn">
        Login
    </button>

            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <div class="social-login">

                <a href="{{ url_for('google_login') }}" class="google-btn">
                    <i class="fab fa-google"></i> Continue with Google
                </a>

                <a href="{{ url_for('github_login') }}" class="github-btn">
                    <i class="fab fa-github"></i> Continue with GitHub
                </a>

            </div>

            <div class="divider">
                <span>OR</span>
            </div>

            <a href="{{ url_for('register.register') }}" class="register-btn">
    Create New Account
</a>

        </div>

    </div>


    </form>

    <script>
        function togglePassword() {

            let pass = document.getElementById("password");

            if (pass.type === "password") {

                pass.type = "text";

            } else {

                pass.type = "password";

            }

        }
    </script>

</body>

</html>
