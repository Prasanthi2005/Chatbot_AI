<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | AI Chatbot Pro</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

</head>

<body>

    <div class="container">

        <div class="register-card">

            <!-- Logo -->
            <div class="logo">

                <img src="{{ url_for('static', filename='images/chat.png') }}" alt="AI Chatbot Pro Logo" class="logo">

                <h2>Create Account</h2>

                <p>Join AI Chatbot</p>

            </div>


            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %} {% if messages %} {% for category, message in messages %}

            <div class="alert {{ category }}">
                {{ message }}
            </div>

            {% endfor %} {% endif %} {% endwith %}


            <!-- Registration Form -->

            <form method="POST" action="{{ url_for('register') }}" enctype="multipart/form-data">
                <!-- Profile Image -->

                <div class="profile-upload">

                    <div class="profile-preview">

                        <img id="profilePreview" src="{{ url_for('static', filename='images/default-profile.png') }}" alt="Profile Photo">

                    </div>

                    <label for="profilePhoto" class="choose-photo">

                        <i class="fa-solid fa-camera"></i>
                        Choose Photo

                    </label>

                    <input type="file" id="profilePhoto" name="profile_photo" accept="image/*" hidden>

                </div>


                <!-- Full Name -->

                <div class="input-group">

                    <label for="fullname">
                        Full Name
                    </label>

                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" autocomplete="name" required>

                </div>


                <!-- Username -->

                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <input type="text" id="username" name="username" placeholder="Choose username" autocomplete="username" required>

                </div>


                <!-- Email -->

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email" id="email" name="email" placeholder="Enter email" autocomplete="email" required>

                </div>


                <!-- Phone -->

                <div class="input-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input type="tel" id="phone" name="phone" placeholder="Enter mobile number" autocomplete="tel">

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input type="password" id="password" name="password" placeholder="Create password" autocomplete="new-password" required>

                        <i class="fa-solid fa-eye toggle-password" data-target="password"></i>

                    </div>

                </div>


                <!-- Confirm Password -->

                <div class="input-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <div class="password-box">

                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm password" autocomplete="new-password" required>

                        <i class="fa-solid fa-eye toggle-password" data-target="confirm_password"></i>

                    </div>

                </div>


                <!-- Password Strength -->

                <div class="strength">

                    <div id="strengthBar"></div>

                </div>

                <small id="strengthText">
                    Password Strength
                </small>


                <!-- Terms & Conditions -->

                <div class="terms">

                    <label>

                        <input type="checkbox"
                               id="terms"
                               name="terms"
                               value="accepted"
                               required>

                        I agree to the

                        <a href="#">
                            Terms & Conditions
                        </a>

                    </label>

                </div>


                <!-- Register Button -->

                <button type="submit" id="registerBtn" class="register-btn">

                    <i class="fa-solid fa-user-plus"></i>

                    Create Account

                </button>


            </form>


            <!-- Login Link -->

            <div class="login-link">

                Already have an account?

                <a href="{{ url_for('login') }}">
                    Login
                </a>

            </div>

        </div>

    </div>


    <!-- Profile Photo Preview -->

    <script>
        const profilePhoto =
            document.getElementById("profilePhoto");

        const profilePreview =
            document.getElementById("profilePreview");


        profilePhoto.addEventListener("change", function() {

            const file = this.files[0];

            if (file) {

                // Check image
                if (!file.type.startsWith("image/")) {

                    alert("Please select an image file.");

                    this.value = "";

                    return;
                }


                // Preview selected image
                const reader = new FileReader();

                reader.onload = function(event) {

                    profilePreview.src =
                        event.target.result;

                };

                reader.readAsDataURL(file);

            }

        });
    </script>


    <!-- Password Show / Hide -->

    <script>
        document.querySelectorAll(".toggle-password")
            .forEach(function(icon) {

                icon.addEventListener("click", function() {

                    const targetId =
                        this.getAttribute("data-target");

                    const input =
                        document.getElementById(targetId);


                    if (input.type === "password") {

                        input.type = "text";

                        this.classList.remove("fa-eye");

                        this.classList.add("fa-eye-slash");

                    } else {

                        input.type = "password";

                        this.classList.remove("fa-eye-slash");

                        this.classList.add("fa-eye");

                    }

                });

            });
    </script>


    <!-- Password Strength -->

    <script>
        const password =
            document.getElementById("password");

        const strengthBar =
            document.getElementById("strengthBar");

        const strengthText =
            document.getElementById("strengthText");


        password.addEventListener("input", function() {

            const value = this.value;

            let strength = 0;


            if (value.length >= 6) {
                strength++;
            }

            if (/[A-Z]/.test(value)) {
                strength++;
            }

            if (/[0-9]/.test(value)) {
                strength++;
            }

            if (/[^A-Za-z0-9]/.test(value)) {
                strength++;
            }


            if (value.length === 0) {

                strengthBar.style.width = "0%";

                strengthText.textContent =
                    "Password Strength";

            } else if (strength <= 1) {

                strengthBar.style.width = "25%";

                strengthText.textContent =
                    "Weak Password";

            } else if (strength === 2) {

                strengthBar.style.width = "50%";

                strengthText.textContent =
                    "Medium Password";

            } else if (strength === 3) {

                strengthBar.style.width = "75%";

                strengthText.textContent =
                    "Good Password";

            } else {

                strengthBar.style.width = "100%";

                strengthText.textContent =
                    "Strong Password";

            }

        });
    </script>


    <!-- Confirm Password Validation -->

    <script>
        const registerForm =
            document.getElementById("registerForm");

        const confirmPassword =
            document.getElementById("confirm_password");


        registerForm.addEventListener("submit", function(event) {

            const passwordValue =
                password.value;

            const confirmValue =
                confirmPassword.value;


            if (passwordValue !== confirmValue) {

                event.preventDefault();

                alert("Passwords do not match!");

                confirmPassword.focus();

                return false;

            }

        });
    </script>


    <!-- Existing JS -->

    <script src="{{ url_for('static', filename='js/register.js') }}"></script>

</body>

</html>
