<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Theme Settings | AI Chatbot Pro</title>


    <link rel="stylesheet" href="{{ url_for('static',filename='css/theme.css') }}">


    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" rel="stylesheet">


</head>


<body>


    <div class="container">


        <div class="theme-card">



            <div class="header">


                <img src="{{ url_for('static',filename='images/logo.png') }}">


                <h2>Theme Settings</h2>


                <p>Customize your chatbot appearance</p>


            </div>





            <div class="theme-options">



                <div class="theme-box active" data-theme="dark">


                    <i class="fa-solid fa-moon"></i>


                    <h3>Dark Mode</h3>


                    <p>Best for night usage</p>


                </div>






                <div class="theme-box" data-theme="light">


                    <i class="fa-solid fa-sun"></i>


                    <h3>Light Mode</h3>


                    <p>Bright clean interface</p>


                </div>






                <div class="theme-box" data-theme="system">


                    <i class="fa-solid fa-desktop"></i>


                    <h3>System</h3>


                    <p>Follow device theme</p>


                </div>



            </div>







            <button id="saveTheme">


<i class="fa-solid fa-check"></i>

Save Theme


</button>





            <div class="back">


                <a href="{{url_for('settings')}}">

                    <i class="fa-solid fa-arrow-left"></i> Back To Settings

                </a>


            </div>





        </div>


    </div>





    <script src="{{url_for('static',filename='js/theme.js')}}"></script>


</body>


</html>
