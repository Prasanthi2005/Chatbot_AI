<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | AI Chatbot</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/forgot_password.css') }}">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" rel="stylesheet">

</head>

<body>

    <div class="background"></div>

    <div class="container">

        <div class="card">

            <div class="logo">

                <img src="{{ url_for('static', filename='images/logo.png') }}">

                <h2>Forgot Password</h2>

                <p>Enter your registered email address</p>

            </div>

            <!-- Flash Messages -->

            {% with messages = get_flashed_messages(with_categories=true) %} {% if messages %} {% for category,message in messages %}

            <div class="alert {{ category }}">

                {{ message }}

            </div>

            {% endfor %} {% endif %} {% endwith %}

            <form action="{{ url_for('forgot_password') }}" method="POST">

                <div class="input-group">

                    <i class="fa-solid fa-envelope"></i>

                    <input type="email" name="email" placeholder="Enter Email Address" required>

                </div>

                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </form>

            <div class="links">

                <a href="{{ url_for('login') }}">

                    <i class="fa-solid fa-arrow-left"></i> Back to Login

                </a>

            </div>
            <form id="forgotForm" method="POST" action="{{ url_for('forgot_password') }}">

        </div>

    </div>
    <script src="{{ url_for('static', filename='js/forgot_password.js') }}"></script>
</body>

</html>
