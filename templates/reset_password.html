<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | AI Chatbot Pro</title>


    <link rel="stylesheet" href="{{ url_for('static',filename='css/reset_password.css') }}">


    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" rel="stylesheet">


</head>


<body>


    <div class="container">


        <div class="reset-card">



            <div class="logo">


                <img src="{{ url_for('static',filename='images/logo.png') }}">


                <h2>Reset Password</h2>


                <p>Create your new secure password</p>


            </div>





            {% with messages=get_flashed_messages(with_categories=true) %} {% if messages %} {% for category,message in messages %}

            <div class="alert {{category}}">
                {{message}}
            </div>


            {% endfor %} {% endif %} {% endwith %}





            <form id="resetForm" method="POST" action="{{ url_for('reset_password') }}">





                <div class="input-group">


                    <label>New Password</label>


                    <div class="password-box">


                        <input type="password" id="password" name="password" placeholder="Enter new password" required>


                        <i class="fa-solid fa-eye toggle-password" data-target="password"></i>


                    </div>


                </div>






                <div class="input-group">


                    <label>Confirm Password</label>


                    <div class="password-box">


                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm password" required>


                        <i class="fa-solid fa-eye toggle-password" data-target="confirm_password"></i>


                    </div>


                </div>





                <div class="strength">


                    <div id="strengthBar"></div>


                </div>


                <small id="strengthText">
Password Strength
</small>






                <button type="submit" id="resetBtn">


<i class="fa-solid fa-lock"></i>

Reset Password


</button>




            </form>






            <div class="back-login">


                <a href="{{ url_for('login') }}">

                    <i class="fa-solid fa-arrow-left"></i> Back to Login

                </a>


            </div>




        </div>


    </div>






    <script src="{{ url_for('static',filename='js/reset_password.js') }}"></script>


</body>


</html>
